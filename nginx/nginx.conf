worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Sembunyikan versi Nginx dan batasi ukuran/timeout (cegah slowloris & body raksasa)
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    client_max_body_size 64k;
    send_timeout 15s;

    # Rate limit: publik (/proxy/) dan admin (/dashboard/, /admin/)
    limit_req_zone $binary_remote_addr zone=proxy_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=admin_limit:1m rate=5r/s;
    limit_req_status 429;

    # Header keamanan dasar untuk semua respons
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    server {
        # Untuk HTTPS produksi: tambahkan `listen 443 ssl;` dan sertifikat
        # (lihat docs/PANDUAN.md bagian "Deploy HTTPS").
        listen 80;
        server_name localhost;

        # Dashboard admin (basic auth)
        location /dashboard/ {
            limit_req zone=admin_limit burst=10 nodelay;
            alias /usr/share/nginx/html/;
            auth_basic "Halimun Administrator";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        location = / {
            return 301 /dashboard/;
        }

        # Admin API Halimun. Hanya lewat dashboard basic auth.
        # Untuk membatasi lebih jauh, aktifkan allow/deny di bawah.
        location /admin/ {
            limit_req zone=admin_limit burst=20 nodelay;
            auth_basic "Halimun Administrator";
            auth_basic_user_file /etc/nginx/.htpasswd;

            # allow 192.168.0.0/16;
            # allow 10.0.0.0/8;
            # deny all;

            proxy_pass http://halimun-proxy:9090/;
            proxy_set_header Host $host;
            # Nginx MENIMPA header ini dengan IP klien asli. Halimun hanya
            # mempercayainya karena security.trust_proxy_headers: true dan
            # port proxy tidak dipublikasikan langsung ke host.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        # Gerbang proxy terenkripsi (publik)
        location /proxy/ {
            limit_req zone=proxy_limit burst=200 nodelay;

            # Batasi metode: Halimun hanya menerima POST
            limit_except POST { deny all; }

            proxy_pass http://halimun-proxy:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Jangan pernah melayani berkas tersembunyi (.htpasswd, .env, .git)
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
