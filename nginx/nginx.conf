worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    # Enable proxy rate limiting logic at the Nginx edge
    limit_req_zone $binary_remote_addr zone=proxy_limit:10m rate=100r/s;

    server {
        listen 80;
        server_name localhost;

        # Serve Lightweight Glassmorphism Dashboard
        location /dashboard/ {
            alias /usr/share/nginx/html/;
            auth_basic "Halimun Administrator";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        # Redirect root to dashboard
        location = / {
            return 301 /dashboard/;
        }

        # Secure Admin API (Only accessible when Dashboard basic auth is passed)
        location /admin/ {
            auth_basic "Halimun Administrator";
            auth_basic_user_file /etc/nginx/.htpasswd;
            
            # Forward to Halimun Rust Proxy's admin port
            proxy_pass http://halimun-proxy:9090/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # You can also add IP restrictions like
            # allow 192.168.0.0/16;
            # allow 10.0.0.0/8;
            # deny all;
        }

        # Proxy Gateway Endpoint
        location /proxy/ {
            # Add request limits
            limit_req zone=proxy_limit burst=200;
            
            # Add IP restrictions if you want closed proxy usage
            # allow 10.0.0.0/8;
            # deny all;

            proxy_pass http://halimun-proxy:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
