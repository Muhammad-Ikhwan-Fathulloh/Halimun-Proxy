[package]
name = "halimun-proxy"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
# Hanya fitur runtime yang benar-benar dipakai (lebih ringan dari "full")
tokio = { version = "1.38", features = ["rt-multi-thread", "net", "macros", "time", "signal", "sync", "fs"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
dashmap = "5.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
url = "2.5"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
dotenvy = "0.15"
clap = { version = "4.5", features = ["derive"] }
metrics = "0.22"
metrics-exporter-prometheus = { version = "0.13", default-features = false, features = ["http-listener"] }

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
