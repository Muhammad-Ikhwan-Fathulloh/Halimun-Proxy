[package]
name = "halimun-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9" # For config parsing
dashmap = "5.5" # Concurrent hashmap for rate limiting & replay guard
uuid = { version = "1.8", features = ["v4"] } # For nonce generation in keys
chrono = "0.4"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8" # For secure random key generation
dotenvy = "0.15" # .env file loading
clap = { version = "4.5", features = ["derive"] } # CLI parsing for keygen
base64 = "0.22"
redis = { version = "0.24", features = ["tokio-comp", "json"] }
metrics = "0.22"
metrics-exporter-prometheus = "0.13"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
