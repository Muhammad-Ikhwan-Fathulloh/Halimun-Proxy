server:
  host: "0.0.0.0"
  port: 80
  admin_port: 9090
  admin_api_key: "change-me-in-production"
  telemetry_port: 9091

encryption:
  # Generate keys using: halimun-proxy --keygen
  aes_key: "64-hex-chars-here"
  hmac_key: "64-hex-chars-here"
  xor_key: 172
  base32_alphabet: "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567"
  ttl_seconds: 3600

security:
  rate_limit_per_minute: 120
  nonce_ttl_seconds: 600
  bypass_whitelist:
    - "api.trusted.com"
  strict_domain: "halimun.yourdomain.com"

services:
  - name: "backend-app"
    type: backend
    url: "http://backend_app:80"
    health: "/health"
    timeout_ms: 10000
