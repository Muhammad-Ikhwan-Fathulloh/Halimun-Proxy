name: halimun

# Topologi:
#   Internet --(80)--> nginx --(jaringan internal pro_net)--> halimun-proxy --> backend
# Hanya nginx yang mempublikasikan port ke host. Halimun dan backend TIDAK bisa
# dijangkau langsung dari luar.
#
# Rahasia dibaca dari file .env (substitusi ${...}) dan diteruskan sebagai env,
# sehingga config.yaml tidak perlu memuat kunci.

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: halimun_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./dashboard:/usr/share/nginx/html:ro
    networks:
      - proxy_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    depends_on:
      - halimun-proxy

  halimun-proxy:
    build: .
    image: halimun-proxy:local
    container_name: halimun_rust
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml
    environment:
      - HALIMUN_AES_KEY=${HALIMUN_AES_KEY:?isi HALIMUN_AES_KEY di .env}
      - HALIMUN_HMAC_KEY=${HALIMUN_HMAC_KEY:?isi HALIMUN_HMAC_KEY di .env}
      - HALIMUN_XOR_KEY=${HALIMUN_XOR_KEY:-172}
      - HALIMUN_ADMIN_KEY=${HALIMUN_ADMIN_KEY:?isi HALIMUN_ADMIN_KEY di .env}
    expose:
      - "8080"
      - "9090"
    networks:
      - proxy_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 128m
    depends_on:
      - backend_dummy

  # Contoh backend. Ganti dengan layanan Anda sendiri.
  backend_dummy:
    image: nginxdemos/hello:plain-text
    container_name: backend_app
    restart: unless-stopped
    networks:
      - proxy_net

networks:
  proxy_net:
    driver: bridge
