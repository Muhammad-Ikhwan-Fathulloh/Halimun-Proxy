version: '3.8'

services:
  # Nginx Reverse Proxy (Gateway)
  nginx:
    image: nginx:alpine
    container_name: halimun_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./dashboard:/usr/share/nginx/html:ro
    networks:
      - proxy_net
    depends_on:
      - halimun-proxy

  # Halimun Encrypted Proxy Tunnel (Hidden behind Nginx)
  halimun-proxy:
    build: .
    container_name: halimun_rust
    volumes:
      - ./config.yaml:/app/config.yaml
    networks:
      - proxy_net
    depends_on:
      - backend_dummy

  # Example Backend Protected by Halimun
  backend_dummy:
    image: nginxdemos/hello:plain-text
    container_name: backend_app
    networks:
      - proxy_net

networks:
  proxy_net:
    driver: bridge
